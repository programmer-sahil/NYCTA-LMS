services:
  mongodb:
    image: mongo:7.0
    container_name: nycta-lms-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - nycta_mongodb_data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nycta_mongodb_data:
